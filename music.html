<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overpopped music candidates</title>
<style>
  body { background: #07080f; color: #e8eaf6; font: 16px ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: #8a90c7; margin: 0 0 24px; font-size: 14px; }
  h2 { font-size: 12px; color: #ffa94d; letter-spacing: 1px; margin: 28px 0 8px; }
  button { display: flex; justify-content: space-between; width: 100%; background: #10122a; color: inherit; font: inherit; border: 1px solid #2b2f55; padding: 14px 16px; margin: 0 0 8px; cursor: pointer; text-align: left; }
  button.on { border-color: #ffd43b; color: #ffd43b; }
  button span { color: #8a90c7; font-size: 13px; }
  #stop { justify-content: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Music candidates</h1>
  <p>Dev page only (not part of the built site). Each track loops; click another to switch.</p>
  <div id="list"></div>
  <button id="stop">Stop</button>
</main>
<script type="module">
  import { TRACKS, createMusic } from './src/music.ts';
  let music = null;
  const list = document.getElementById('list');
  const buttons = [];
  for (const [style, kind] of [['modern', 'level'], ['modern', 'boss'], ['chip', 'level'], ['chip', 'boss']]) {
    const h = document.createElement('h2');
    h.textContent = (style === 'modern' ? 'MODERN SOUND' : 'FIRST VERSION (8-BIT)') + ' · ' + (kind === 'level' ? 'ORDINARY LEVELS' : 'LAST LEVEL OF A FLOOR');
    list.append(h);
    for (const t of TRACKS.filter((x) => x.kind === kind && (x.style ?? 'chip') === style)) {
      const b = document.createElement('button');
      b.innerHTML = `${t.name}<span>${t.bpm} bpm</span>`;
      b.onclick = () => play(t.id);
      b.dataset.id = t.id;
      list.append(b);
      buttons.push(b);
    }
  }
  function play(id) {
    if (!music) {
      const ac = new AudioContext(), gain = ac.createGain();
      gain.gain.value = 0.8;
      const an = ac.createAnalyser();
      gain.connect(an).connect(ac.destination);
      music = createMusic(ac, gain);
      window.__music = { ac, an };
    }
    music.play(id);
    for (const b of buttons) b.classList.toggle('on', b.dataset.id === id);
  }
  document.getElementById('stop').onclick = () => play(null);
</script>
</body>
</html>
